<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6750A4">
  <meta name="description" content="Personal link page">
  <title>YetAnotherLinktree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="profile" aria-label="Profil">
      <div class="avatar" id="avatar">Y</div>
      <h1 id="profileName">Your Name</h1>

    <footer>
      <span id="footerText">YetAnotherLinktree</span>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
